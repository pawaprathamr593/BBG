name: BBG backend validation

on:
  push:
    branches:
      - feature/auth-foundation
      - fix/bbg-seven-layer-audit
      - development
      - feature/public-marketplace-pages
      - feature/business-onboarding-lifecycle
      - HG_CODE_IMPROVEMENTS
  pull_request:
    branches:
      - main
      - feature/auth-foundation

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install backend Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Lint backend PHP files
        run: |
          find backend/src backend/config -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l backend/yii
      - name: Verify API route and actionType contracts
        run: php backend/tests/static_api_contract_check.php

  mysql-migrations:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bbg
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Apply additive Phase 1 migrations to clean MySQL 8.4
        env:
          MYSQL_PWD: root
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -uroot bbg < backend/database/migrations/20261112_001_business_application_and_cart.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot bbg < backend/database/migrations/20261112_002_marketplace_baseline.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot bbg < backend/database/migrations/20261113_001_public_marketplace_engagement.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot bbg < backend/database/migrations/20261113_002_social_identity_mapping.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot bbg < backend/database/migrations/20261113_003_public_product_discovery_support.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot bbg -e "
            CREATE TABLE TENANT_SUBSCRIPTIONS (
              id INT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
              tenant_id INT UNSIGNED NOT NULL,
              subscription_status VARCHAR(20) NOT NULL,
              approved_by INT UNSIGNED NULL,
              approved_on DATETIME NULL,
              rejection_reason VARCHAR(500) NULL,
              updated_by INT UNSIGNED NULL,
              updated_on DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
              created_by INT UNSIGNED NULL,
              created_on DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
              status VARCHAR(1) NOT NULL DEFAULT 'A'
            );
            CREATE TABLE SUBSCRIPTION_PAYMENT_PROOFS (
              id INT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
              tenant_id INT UNSIGNED NOT NULL,
              subscription_id INT UNSIGNED NOT NULL,
              reviewed_by INT UNSIGNED NULL,
              reviewed_on DATETIME NULL,
              review_status VARCHAR(20) NOT NULL DEFAULT 'PENDING',
              status VARCHAR(1) NOT NULL DEFAULT 'A'
            );
          "
          mysql --protocol=tcp -h 127.0.0.1 -uroot bbg < backend/database/migrations/20261117_002_subscription_payment_review_workflow.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot bbg -e "
            CREATE TABLE BUSINESS_PROFILES (
              id INT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
              latitude DECIMAL(10,2) NULL,
              longitude DECIMAL(10,2) NULL
            );
          "
          mysql --protocol=tcp -h 127.0.0.1 -uroot bbg < backend/database/migrations/20261119_001_business_profile_geolocation_precision.sql
      - name: Verify migration tables and generated cart keys
        env:
          MYSQL_PWD: root
        run: |
          count=$(mysql --protocol=tcp -N -h 127.0.0.1 -uroot bbg -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='bbg' AND table_name IN ('BUSINESS_APPLICATIONS','BUSINESS_APPLICATION_DOCUMENTS','BUSINESS_APPLICATION_REVIEWS','CARTS','CART_ITEMS','BUSINESS_PROFILES','CATEGORIES','TENANT_PRODUCT_CATEGORIES','UNITS_OF_MEASURE','PRODUCTS','PRODUCT_VARIANTS','STOREFRONT_SETTINGS','CUSTOMER_IDENTITIES','TENANT_CUSTOMERS','CUSTOMER_ADDRESSES','ORDERS','ORDER_ITEMS','ORDER_STATUS_HISTORY','ORDER_FULFILMENTS','CONTENT_VIEWS','CONTENT_LIKES','PRODUCT_MEDIA','CUSTOMER_ENQUIRIES','USER_IDENTITIES','PLATFORM_PAYMENT_QR_CONFIG','TENANT_SUBSCRIPTION_PAYMENT_INSTRUCTIONS','TENANT_SUBSCRIPTION_REVIEW_HISTORY')")
          test "$count" -eq 27
          generated=$(mysql --protocol=tcp -N -h 127.0.0.1 -uroot bbg -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='bbg' AND extra LIKE '%STORED GENERATED%' AND table_name IN ('CARTS','CART_ITEMS')")
          test "$generated" -eq 4
          coordinates=$(mysql --protocol=tcp -N -h 127.0.0.1 -uroot bbg -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='bbg' AND table_name='BUSINESS_PROFILES' AND ((column_name IN ('latitude','longitude') AND numeric_precision=10 AND numeric_scale=7) OR (column_name='location_accuracy_m' AND numeric_precision=10 AND numeric_scale=2))")
          test "$coordinates" -eq 3
      - name: Verify global Consumer role seed and idempotent account assignment
        env:
          MYSQL_PWD: root
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -uroot bbg -e "
            CREATE TABLE USERS (
              id INT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
              account_status VARCHAR(20) NOT NULL,
              status VARCHAR(1) NOT NULL DEFAULT 'A'
            );
            CREATE TABLE ROLES (
              id INT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
              role_code VARCHAR(50) NOT NULL,
              role_name VARCHAR(100) NOT NULL,
              scope_type VARCHAR(20) NOT NULL,
              description VARCHAR(500) NULL,
              status VARCHAR(1) NOT NULL DEFAULT 'A'
            );
            CREATE TABLE USER_ROLE_ASSIGNMENTS (
              id INT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
              user_id INT UNSIGNED NOT NULL,
              role_id INT UNSIGNED NOT NULL,
              tenant_id INT UNSIGNED NULL,
              assigned_by INT UNSIGNED NULL,
              assigned_on DATETIME NOT NULL,
              expires_on DATETIME NULL,
              status VARCHAR(1) NOT NULL DEFAULT 'A',
              created_by INT UNSIGNED NULL,
              created_on DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
              updated_by INT UNSIGNED NULL,
              updated_on DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
            );
            INSERT INTO USERS (account_status, status) VALUES
              ('ACTIVE', 'A'), ('ACTIVE', 'A'), ('INACTIVE', 'A');
          "
          mysql --protocol=tcp -h 127.0.0.1 -uroot bbg < backend/database/seeds/20261113_004_global_consumer_role.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot bbg < backend/database/seeds/20261113_004_global_consumer_role.sql
          assignments=$(mysql --protocol=tcp -N -h 127.0.0.1 -uroot bbg -e "SELECT COUNT(*) FROM USER_ROLE_ASSIGNMENTS ura INNER JOIN ROLES r ON r.id=ura.role_id WHERE r.role_code='CONSUMER' AND r.scope_type='GLOBAL' AND ura.tenant_id IS NULL AND ura.status='A'")
          role_count=$(mysql --protocol=tcp -N -h 127.0.0.1 -uroot bbg -e "SELECT COUNT(*) FROM ROLES WHERE role_code='CONSUMER' AND scope_type='GLOBAL' AND status='A'")
          test "$assignments" -eq 2
          test "$role_count" -eq 1

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build Angular frontend
        working-directory: frontend
        run: npm run build
