name: Frontend validation

on:
  push:
    branches:
      - feature/frontend-development
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-validation.yml'
  pull_request:
    branches:
      - feature/frontend-development
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Angular build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate sitemap generator syntax
        run: node --check scripts/generate-sitemap.mjs
      - name: Production build
        run: npm run build
      - name: Unit tests
        run: npm test -- --watch=false
