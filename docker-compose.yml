name: bbg

services:
  php:
    image: bbc-php:8.4
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: bbg-php
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-bbg}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_EMAIL_OTP_TTL: ${AUTH_EMAIL_OTP_TTL:-600}
      AUTH_EMAIL_OTP_MAX_ATTEMPTS: ${AUTH_EMAIL_OTP_MAX_ATTEMPTS:-5}
      AUTH_EMAIL_OTP_RESEND_COOLDOWN: ${AUTH_EMAIL_OTP_RESEND_COOLDOWN:-60}
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:-}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-900}
      AUTH_REFRESH_TOKEN_TTL: ${AUTH_REFRESH_TOKEN_TTL:-2592000}
      AUTH_REFRESH_COOKIE_SECURE: ${AUTH_REFRESH_COOKIE_SECURE:-false}
      AUTH_REFRESH_COOKIE_SAMESITE: ${AUTH_REFRESH_COOKIE_SAMESITE:-Lax}
      AUTH_REFRESH_COOKIE_DOMAIN: ${AUTH_REFRESH_COOKIE_DOMAIN:-}
      AUTH_TOKEN_ISSUER: ${AUTH_TOKEN_ISSUER:-bbg}
      AUTH_TOKEN_AUDIENCE: ${AUTH_TOKEN_AUDIENCE:-bbg-web}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_URL_TTL_MINUTES: ${AWS_S3_URL_TTL_MINUTES:-10}
      AWS_S3_MAX_UPLOAD_BYTES: ${AWS_S3_MAX_UPLOAD_BYTES:-10485760}
    networks:
      - bbg-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bbg-redis
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - bbg-network
    restart: unless-stopped

  nginx:
    image: nginx:stable
    container_name: bbg-nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - bbg-network
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: bbg-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bbg}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - bbg-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: bbg-phpmyadmin
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bbg-network
    restart: unless-stopped

  frontend:
    image: node:26-bookworm-slim
    container_name: bbg-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - bbg_frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    command: sh -c "npm start -- --host 0.0.0.0 --port 4200"
    networks:
      - bbg-network
    restart: unless-stopped

volumes:
  mysql_data:
    external: true
    name: dark-store_mysql_data
  bbg_frontend_node_modules:

networks:
  bbg-network:
    driver: bridge
