<div class="app-shell">
  <header class="topbar">
    <a class="brand" routerLink="/" aria-label="BBG home" (click)="closeMenu()">
      <span class="brand-mark" aria-hidden="true">B</span>
      <span class="brand-copy"><strong>BBG</strong><small>Business platform</small></span>
    </a>

    <button class="menu-toggle" type="button" [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-navigation" aria-label="Toggle navigation" (click)="toggleMenu()">
      <span></span><span></span><span></span>
    </button>

    <nav id="primary-navigation" class="primary-nav" [class.is-open]="menuOpen()" aria-label="Primary navigation">
      <a class="nav-link" routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()">Overview</a>
      <a class="nav-link" routerLink="/login" routerLinkActive="is-active" (click)="closeMenu()">Sign in</a>
      <a class="nav-link" routerLink="/register" routerLinkActive="is-active" (click)="closeMenu()">Create account</a>
    </nav>

    <div class="topbar-meta">
      <span class="environment-indicator"><span></span> Workspace preview</span>
      <div class="avatar" aria-label="Guest profile">G</div>
    </div>
  </header>

  <main class="main-content">
    <router-outlet />
    <footer class="app-footer">
      <span>© {{ currentYear }} BBG</span>
      <span>Built for connected business experiences</span>
    </footer>
  </main>
</div>
