<main class="auth-shell">
  <button class="auth-theme-toggle" type="button" (click)="toggleTheme()" [attr.aria-label]="'Switch to ' + (isDarkTheme ? 'light' : 'dark') + ' theme'">
    {{ isDarkTheme ? '☀ Light' : '☾ Dark' }}
  </button>
  <a class="auth-brand" routerLink="/" aria-label="Return to BBG home">
    <span class="brand-mark" aria-hidden="true">B</span>
    <span><strong>BBG</strong><small>Business, better connected</small></span>
  </a>
  <router-outlet />
  <p class="auth-footnote">© {{ currentYear }} BBG</p>
</main>
