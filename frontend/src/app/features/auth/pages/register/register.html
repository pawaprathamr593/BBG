<section class="auth-page">
  <div class="auth-card">
    <a class="auth-brand" routerLink="/" aria-label="BBG home"><span class="brand-mark">B</span><span><strong>BBG</strong><small>Business platform</small></span></a>
    <p class="eyebrow">GET STARTED</p>
    <h1>Create your account</h1>
    <p class="intro">One account to connect with businesses and manage your workspace.</p>
    @if (error()) { <p class="error" role="alert">{{ error() }}</p> }
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label for="full_name">Full name</label>
      <input id="full_name" type="text" autocomplete="name" formControlName="full_name" placeholder="Your full name">
      <label for="email">Email address <span>(optional if mobile is supplied)</span></label>
      <input id="email" type="email" autocomplete="email" formControlName="email" placeholder="name@example.com">
      <label for="mobile">Mobile number <span>(optional if email is supplied)</span></label>
      <input id="mobile" type="tel" autocomplete="tel" formControlName="mobile" placeholder="Mobile number">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="new-password" formControlName="password" placeholder="At least 8 characters">
      @if (form.controls.password.touched && form.controls.password.invalid) { <small class="field-error">Use at least 8 characters.</small> }
      <button type="submit" [disabled]="busy()">{{ busy() ? 'Creating account…' : 'Create account' }}</button>
    </form>
    <p class="switch-auth">Already registered? <a routerLink="/login">Sign in</a></p>
  </div>
</section>
