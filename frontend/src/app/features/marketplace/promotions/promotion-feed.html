<main class="page">
  <app-page-banner
    variant="discovery"
    eyebrow="Bavdhan Business Group"
    title="Discover"
    titleAccent="promotions"
    description="Keep up with the latest public promotions and exclusive deals shared by businesses in Bavdhan."
  />
  <section class="content">
    <div class="heading">
      <div>
        <p class="eyebrow">WHAT'S HAPPENING</p>
        <h2>Latest promotions</h2>
      </div>
      <span>{{ total() }} available</span>
    </div>
    @if (loading()) {
      <div style="padding: 24px 0">
        <app-skeleton-loader variant="card" [count]="3" />
      </div>
    } @else if (error()) {
      <div class="state error" role="alert">{{ error() }}</div>
    } @else if (promotions().length) {
      <div class="grid">
        @for (promotion of promotions(); track promotion.id) {
          <app-promotion-card [promotion]="promotion" (selected)="openPromotion($event)" />
        }
      </div>
      <app-infinite-scroll-sentinel
        [hasMore]="hasMore()"
        [loadingMore]="loadingMore()"
        [loadedCount]="promotions().length"
        [totalItems]="total()"
        itemLabel="promotions"
        (loadMore)="loadMore()"
      />
    } @else {
      <app-empty-state
        icon="🎁"
        title="No active promotions right now"
        description="When businesses publish special offers or seasonal discounts, they will appear here."
        actionText="Explore products"
        (actionClicked)="exploreProducts()"
      />
    }
  </section>
</main>
