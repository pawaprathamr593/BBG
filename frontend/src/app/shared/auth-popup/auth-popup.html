@if (dialog.state(); as state) {
  <div class="auth-popup-backdrop" (click)="close()" role="presentation"></div>
  <section
    class="auth-popup"
    [attr.data-placement]="state.placement"
    [attr.data-has-anchor]="state.hasAnchor"
    [style.top.px]="state.top"
    [style.left.px]="state.left"
    [style.--arrow-offset]="state.arrowOffset + 'px'"
    role="dialog"
    aria-modal="true"
    aria-label="BBG authentication"
  >
    <button type="button" class="popup-close" (click)="close()" aria-label="Close sign-in">
      ×
    </button>
    <app-auth-experience
      [mode]="state.mode"
      presentation="popup"
      [reason]="state.reason"
      (authenticated)="authenticated()"
    />
  </section>
}
