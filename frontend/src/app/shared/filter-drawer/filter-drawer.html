<button
  class="filter-fab"
  type="button"
  [attr.aria-expanded]="open"
  aria-haspopup="dialog"
  aria-label="Open advanced filters"
  (click)="openChange.emit(true)"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 6h16M7 12h10m-7 6h4" />
    <circle cx="8" cy="6" r="1.5" />
    <circle cx="15" cy="12" r="1.5" />
    <circle cx="12" cy="18" r="1.5" />
  </svg>
  <span>Filters</span>
  @if (activeCount > 0) {
    <span class="filter-count" aria-label="{{ activeCount }} active filters">{{
      activeCount
    }}</span>
  }
</button>

<app-workspace-drawer
  [open]="open"
  title="Filters"
  eyebrow="REFINE RESULTS"
  description="Adjust the results shown in this workspace."
  width="compact"
  [offsetHeader]="true"
  (closed)="close()"
>
  <ng-content />
  <footer workspace-drawer-footer class="drawer-footer">
    <button class="drawer-reset" type="button" (click)="reset.emit()">Reset</button>
    <button class="drawer-apply" type="button" (click)="apply.emit()">Apply Filters</button>
  </footer>
</app-workspace-drawer>
